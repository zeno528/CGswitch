interface:
  display_name: "CGswitch 性能基线"
  short_description: "测量、比较并保存 CGswitch 性能基线"
  default_prompt: "Use $performance-baseline to measure CGswitch performance and append a comparable baseline record."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "neutral-source"
