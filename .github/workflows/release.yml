# 发版流水线（构建+发布准备）：/release skill 负责跑 bump 脚本与撰写 CHANGELOG 内容
# （第一个 ## [版本] - 日期 段落，版本号与日期起草时写死）；本工作流承担确定性动作——校验、
# 三平台构建、创建发行页（发行说明 = CHANGELOG 第一段原文照抄 + 安装指南兜底）、上传产物。
# 工作流不回写 main，CHANGELOG 无归档步骤。
# 触发方式：仅手动（workflow_dispatch），发版是显式决策，push main / push tag 都不触发。
# release_mode 三选一：draft（默认）构建完停在草稿、不通知关注者，等 /release skill 人工发布；
# prerelease 构建完自动以预发行公开（不占 latest 指针）；latest 构建完自动正式发布并通知关注者。
name: Release

on:
  # 手动触发（Actions UI → Run workflow 或 gh workflow run），版本提交后从 main 分支执行；
  # CLI 传参：gh workflow run release.yml --ref main -f release_mode=<draft|prerelease|latest>
  workflow_dispatch:
    inputs:
      release_mode:
        description: 发行模式（draft=停在草稿 / prerelease=自动预发行 / latest=自动正式发布）
        type: choice
        options:
          - draft
          - prerelease
          - latest
        default: draft

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # 只跑 guard 三步（分支校验/VERSION 非空/已发布跳过），秒级放行；
    # 完整质量检查由 CI 在同一次 push 上对同一 SHA 执行，不在这里重复挡构建
    name: verify
    runs-on: ubuntu-24.04
    outputs:
      # 版本已公开发布（重复 dispatch 不重发）时为 true，下游全部跳过
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: 仅允许从 main 分支手动触发
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::发行工作流只能从 main 分支手动触发（当前：$RELEASE_REF）"
            exit 1
          fi
      - uses: actions/checkout@v7
      # 第 0 秒拦截：VERSION 非空即视为发版（CHANGELOG 无任何版本段落时，
      # 发行页只带兜底标题行与安装指南）。仅当该版本已公开发布时绿色跳过，避免重复 dispatch 重复构建。
      - id: guard
        name: 校验 VERSION
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          [ -n "$VERSION" ] || { echo "::error::VERSION 文件为空"; exit 1; }
          # 版本已公开发布：改 CHANGELOG 也不会重发（release job 本就拒绝修改已公开内容），跳过省一轮构建
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null || true)"
            if [ "$IS_DRAFT" = "false" ]; then
              echo "::notice::v$VERSION 已公开发布，跳过重复构建"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: verify
    if: needs.verify.outputs.skip != 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            upload-paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            upload-paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            upload-paths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # 仓库根目录的 rust-toolchain.toml 统一固定检查与构建工具链。
      - run: rustup target add ${{ matrix.rust-target }}
        shell: bash
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.rust-target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          # 只上传安装包产物，避免把 .app 内的图标/脚本等打包文件一并传进发行页
          path: ${{ matrix.upload-paths }}
          retention-days: 1
          if-no-files-found: error

  release:
    # 校验和所有平台构建成功后才会执行；任何失败都不会创建发行。
    # needs 显式列出 verify 以便读取其 skip 输出（仅间接依赖时 needs 上下文拿不到）
    needs: [verify, build]
    if: needs.verify.outputs.skip != 'true'
    # 手动触发执行：draft 模式构建完把资产收进草稿；prerelease/latest 收完立即公开。
    # tag 由 git push 创建（releases API 的 --target 在 GITHUB_TOKEN 下受 workflow-scope
    # 限制会 403，见 cli/cli#9514；git 协议不受限）；release 不带 --target 挂到已有 tag。
    # 用 GITHUB_TOKEN 创建 release/tag 不会再次触发本工作流（官方防递归机制；本工作流已无自动触发器）。
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 拉全历史与 tag：生成 Full Changelog 对比链接需要取上一版本 tag
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          # 发行日期按维护者时区取当天（仅兜底标题行使用：CHANGELOG 没有任何版本段落时）
          echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      # 发行模式由手动触发入参决定（默认 draft 停在草稿）
      - id: mode
        run: |
          echo "mode=${INPUT_MODE:-draft}" >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          INPUT_MODE: ${{ github.event.inputs.release_mode }}
      # 发行说明 = CHANGELOG.md 第一个版本段落原文照抄（标题行 ## [版本] - 日期 由
      # /release skill 起草时写好；照抄前校验段落版本号 == VERSION，不一致 fail-fast）+
      # 安装指南兜底（必带）+ GitHub 原生生成的 PR 清单 / 贡献者 / Full Changelog。整份
      # CHANGELOG 没有任何版本段落时兜底生成标题行。已存在草稿（重跑场景）则更新，已公开则拒绝改动
      - id: create
        name: 创建发行页（draft 模式建草稿；prerelease/latest 先建草稿收资产，run 内立即转正，不停草稿）
        run: |
          TAG="v$VERSION"
          NOTES="$(mktemp)"
          SECTION_VERSION="$(awk '/^## \[/{ if (match($0, /^## \[[^]]+\]/)) print substr($0, 5, RLENGTH-5); exit }' CHANGELOG.md)"
          if [ -n "$SECTION_VERSION" ]; then
            [ "$SECTION_VERSION" = "$VERSION" ] || {
              echo "::error::CHANGELOG.md 第一段版本号 [$SECTION_VERSION] 与 VERSION [$VERSION] 不一致；对齐段落标题与 VERSION 后重新 dispatch"
              exit 1
            }
            # 第一段原文照抄（含标题行，到下一个 ## 二级标题为止）
            awk '
              /^## \[/ { if (found) exit; found = 1 }
              found { print }
            ' CHANGELOG.md > "$NOTES"
            # latest.json 的 notes 用去掉标题行的干净正文（纯标题段落视为无日志）
            tail -n +2 "$NOTES" > release-notes-section.md
          else
            printf '## [%s] - %s\n' "$VERSION" "$DATE" > "$NOTES"
            : > release-notes-section.md
          fi
          GUIDE="$(mktemp)"
          cat > "$GUIDE" <<'EOF'

          ---

          ## 下载安装指引

          | 系统 | 下载 | 安装 |
          | --- | --- | --- |
          | Windows | `CGswitch-v__VERSION__-Windows-setup.exe` | 双击安装；批量部署、静默安装可选 `CGswitch-v__VERSION__-Windows.msi` |
          | macOS | Apple 芯片：`CGswitch-v__VERSION__-macOS-arm64.dmg`<br>Intel：`CGswitch-v__VERSION__-macOS-x64.dmg` | 打开后拖入「应用程序」 |

          > **macOS 首次打开被阻止？** 在「系统设置 → 隐私与安全性」中允许打开；仍无法打开时执行：
          >
          > ```bash
          > xattr -cr /Applications/CGswitch.app
          > ```
          >
          > 然后重试；若应用不在 `/Applications`，将命令中的路径替换为实际 `.app` 路径。
          EOF
          sed -i "s/__VERSION__/$VERSION/g" "$GUIDE"
          cat "$NOTES" "$GUIDE" > "$NOTES.full" && mv "$NOTES.full" "$NOTES"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          # PR 清单 / 新贡献者 / Full Changelog 用 GitHub 原生 API 生成后拼到说明末尾。
          # 不用 create --generate-notes：PATCH 更新接口不支持该参数，重跑更新草稿时清单会丢；
          # 显式生成拼进正文，创建与重跑两条路径行为一致
          printf '\n' >> "$NOTES"
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body >> "$NOTES"
          STATE="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || true)"
          if [ -z "$STATE" ]; then
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$NOTES"
          elif [ "$STATE" = true ]; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            # 正常情况 verify 的 guard 步已绿色跳过；走到这里是构建期间被并发公开的竞态
            echo "::error::发行 $TAG 已经公开，拒绝修改已发布内容；请先递增 VERSION。"
            exit 1
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DATE: ${{ steps.version.outputs.date }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: steps.create.outputs.skip != 'true'
        with:
          path: artifacts
      - name: 整理发行资产名称
        if: steps.create.outputs.skip != 'true'
        run: |
          mkdir -p release-assets
          copy_asset() { cp "$(find "$1" -type f -name "$2" -print -quit)" "$3"; }
          copy_asset artifacts/bundle-windows-x64 '*.exe' "release-assets/CGswitch-v$VERSION-Windows-setup.exe"
          copy_asset artifacts/bundle-windows-x64 '*.msi' "release-assets/CGswitch-v$VERSION-Windows.msi"
          copy_asset artifacts/bundle-windows-x64 '*.exe.sig' "release-assets/CGswitch-v$VERSION-Windows-setup.exe.sig"
          copy_asset artifacts/bundle-macos-x64 '*.dmg' "release-assets/CGswitch-v$VERSION-macOS-x64.dmg"
          copy_asset artifacts/bundle-macos-x64 '*.app.tar.gz' "release-assets/CGswitch-v$VERSION-macOS-x64.app.tar.gz"
          copy_asset artifacts/bundle-macos-x64 '*.app.tar.gz.sig' "release-assets/CGswitch-v$VERSION-macOS-x64.app.tar.gz.sig"
          copy_asset artifacts/bundle-macos-arm64 '*.dmg' "release-assets/CGswitch-v$VERSION-macOS-arm64.dmg"
          copy_asset artifacts/bundle-macos-arm64 '*.app.tar.gz' "release-assets/CGswitch-v$VERSION-macOS-arm64.app.tar.gz"
          copy_asset artifacts/bundle-macos-arm64 '*.app.tar.gz.sig' "release-assets/CGswitch-v$VERSION-macOS-arm64.app.tar.gz.sig"
          node - "$VERSION" "$GITHUB_REPOSITORY" <<'NODE'
          const fs = require("fs");
          const [version, repository] = process.argv.slice(2);
          const asset = (name) => `https://github.com/${repository}/releases/download/v${version}/${name}`;
          const signature = (name) => fs.readFileSync(`release-assets/${name}`, "utf8").trim();
          // 应用内升级弹窗展示的更新日志（同一段落也拼进了发行页正文）；
          // 空日志发版时省略 notes 字段，客户端按无日志兜底
          const notes = fs.readFileSync("release-notes-section.md", "utf8").trim();
          fs.writeFileSync("release-assets/latest.json", `${JSON.stringify({
            version,
            notes: notes || undefined,
            platforms: {
              "darwin-x86_64": { url: asset(`CGswitch-v${version}-macOS-x64.app.tar.gz`), signature: signature(`CGswitch-v${version}-macOS-x64.app.tar.gz.sig`) },
              "darwin-aarch64": { url: asset(`CGswitch-v${version}-macOS-arm64.app.tar.gz`), signature: signature(`CGswitch-v${version}-macOS-arm64.app.tar.gz.sig`) },
              "windows-x86_64": { url: asset(`CGswitch-v${version}-Windows-setup.exe`), signature: signature(`CGswitch-v${version}-Windows-setup.exe.sig`) }
            }
          }, null, 2)}\n`);
          NODE
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: 上传产物到草稿
        if: steps.create.outputs.skip != 'true'
        run: gh release upload "v$VERSION" release-assets/* --clobber
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      # 草稿（draft，默认路径）到此为止：草稿就绪，等 /release skill 走人工发布（Step 4）。
      # prerelease / latest 模式资产就绪后在 run 内立即公开，永不停在草稿等人转换；
      # 预发行不传 --latest，不抢占 latest 指针。
      - name: 按模式公开发行
        if: steps.create.outputs.skip != 'true' && steps.mode.outputs.mode != 'draft'
        shell: bash
        run: |
          if [ "$MODE" = "prerelease" ]; then
            gh release edit "v$VERSION" --draft=false --prerelease
            echo "已作为预发行发布（不占用 latest 指针）：https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          else
            gh release edit "v$VERSION" --draft=false --latest
            echo "已作为最新版本发布并通知关注者：https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          fi
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
