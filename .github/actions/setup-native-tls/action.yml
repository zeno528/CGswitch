name: Setup native TLS build tools
description: Build prerequisites for the subscription HTTP transport
runs:
  using: composite
  steps:
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $tools = @{
          cmake = Join-Path $env:ProgramFiles 'CMake/bin/cmake.exe'
          nasm = Join-Path $env:ProgramFiles 'NASM/nasm.exe'
          llvm = Join-Path $env:ProgramFiles 'LLVM/bin/libclang.dll'
        }
        foreach ($name in @('cmake', 'nasm')) {
          $command = Get-Command $name -CommandType Application -ErrorAction SilentlyContinue
          if ($command) { $tools[$name] = $command.Source }
        }
        if ($env:LIBCLANG_PATH -and (Test-Path -LiteralPath (Join-Path $env:LIBCLANG_PATH 'libclang.dll'))) {
          $tools.llvm = Join-Path $env:LIBCLANG_PATH 'libclang.dll'
        }
        $missing = @($tools.Keys | Where-Object { -not (Test-Path -LiteralPath $tools[$_] -PathType Leaf) })
        if ($missing.Count -gt 0) {
          choco install @missing -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        foreach ($path in $tools.Values) {
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "构建工具缺失：$path" }
        }
        $tools.Values | ForEach-Object { Split-Path -Parent $_ } | Select-Object -Unique | Add-Content -LiteralPath $env:GITHUB_PATH -Encoding utf8
        "LIBCLANG_PATH=$(Split-Path -Parent $tools.llvm)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        # cmake 与 CLT 的 libclang 均为 runner 预装，clang-sys 默认搜索 CLT 路径，
        # 不安装也不设 LIBCLANG_PATH；断言失败说明镜像变更，回来补 brew install llvm。
        command -v cmake >/dev/null || { echo "::error::cmake 缺失，runner 镜像变更"; exit 1; }
        [[ -f /Library/Developer/CommandLineTools/usr/lib/libclang.dylib ]] || { echo "::error::CLT libclang 缺失，runner 镜像变更，需恢复 brew install llvm + LIBCLANG_PATH"; exit 1; }
